name: "ESP-NOW 2 MQTT"
version: "0.3.0"
slug: espnow2mqtt
description: "USB ESP32-S3 coordinator bridge for ESP-NOW devices (use with espnow2mqtt-ha integration)"
url: "https://github.com/SFNFIH/espnow2mqtt-bridge"
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
uart: true
usb: true
services:
  - mqtt:need
options:
  port: /dev/ttyACM0
  baud: 115200
  base_topic: espnow2mqtt
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  ha_discovery: false
schema:
  port: str
  baud: int
  base_topic: str
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  ha_discovery: bool
map:
  - share:rw
